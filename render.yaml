services:
  - type: web
    name: delarte-control-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    autoDeployTrigger: off
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: framework
      - key: APP_AUTH_LOGIN_TRUSTED_PROXY_HOPS
        value: "1"
      - key: APP_BOOTSTRAP_ENABLED
        value: "false"
      - key: APP_PHOTO_STORAGE_PROVIDER
        value: imagekit
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_MIGRATION_USERNAME
        sync: false
      - key: DB_MIGRATION_PASSWORD
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_PHOTO_STORAGE_ROOT
        value: /tmp/delarte-legacy-photos
      - key: APP_PHOTO_STORAGE_SIGNING_SECRET
        generateValue: true
      - key: APP_IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: APP_IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: APP_IMAGEKIT_FOLDER
        value: /delarte/devices
