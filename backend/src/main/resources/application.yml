spring:
  application:
    name: iphone-resale
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    user: ${DB_MIGRATION_USERNAME:${DB_USERNAME}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: false
  servlet:
    multipart:
      max-file-size: ${APP_UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${APP_UPLOAD_MAX_REQUEST_SIZE:42MB}

app:
  business-time-zone: ${APP_BUSINESS_TIMEZONE:America/Bahia}
  auth:
    token-ttl: ${APP_AUTH_TOKEN_TTL:PT12H}
    login-max-attempts: ${APP_AUTH_LOGIN_MAX_ATTEMPTS:5}
    login-window: ${APP_AUTH_LOGIN_WINDOW:PT1M}
    login-max-tracked-clients: ${APP_AUTH_LOGIN_MAX_TRACKED_CLIENTS:10000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  photo-storage:
    provider: ${APP_PHOTO_STORAGE_PROVIDER:local}
    root: ${APP_PHOTO_STORAGE_ROOT}
    signing-secret: ${APP_PHOTO_STORAGE_SIGNING_SECRET}
    signed-url-ttl: ${APP_PHOTO_STORAGE_SIGNED_URL_TTL:PT5M}
    imagekit:
      private-key: ${APP_IMAGEKIT_PRIVATE_KEY:}
      url-endpoint: ${APP_IMAGEKIT_URL_ENDPOINT:}
      folder: ${APP_IMAGEKIT_FOLDER:/delarte/devices}
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:false}
    name: ${APP_BOOTSTRAP_NAME:}
    username: ${APP_BOOTSTRAP_USERNAME:}
    password: ${APP_BOOTSTRAP_PASSWORD:}

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: "OFF"
