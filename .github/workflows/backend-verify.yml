name: Backend verify

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-verify.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven clean verify
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Require PostgreSQL integration tests
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          reports = list(pathlib.Path('target/failsafe-reports').glob('TEST-*.xml'))
          assert reports, 'PostgreSQL integration test reports are required'
          for report in reports:
              suite = ET.parse(report).getroot()
              assert int(suite.get('tests', '0')) > 0, f'Empty suite: {report}'
              assert int(suite.get('skipped', '0')) == 0, f'Skipped integration tests: {report}'
          PY
