name: Format diff Etapa J

on:
  push:
    branches: [codex/etapa-j-finance-initialization]
    paths:
      - ".github/workflows/format-diff-stage-j.yml"

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
        env:
          HUSKY: 0
      - run: npx prettier --write src/features/financial/periods.ts src/pages/DashboardPage.tsx src/pages/FinancialPage.tsx src/styles/globals.css
        working-directory: frontend
      - name: Show formatting diff
        run: git diff -- frontend/src/features/financial/periods.ts frontend/src/pages/DashboardPage.tsx frontend/src/pages/FinancialPage.tsx frontend/src/styles/globals.css
