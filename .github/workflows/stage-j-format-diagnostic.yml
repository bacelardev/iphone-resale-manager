name: Stage J format diagnostic

on:
  push:
    branches: ["codex/etapa-j-finance-initialization"]
    paths: [".github/workflows/stage-j-format-diagnostic.yml"]

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Print formatter diff
        run: |
          npx prettier --write e2e/stage-j.spec.ts src/features/financial/periods.ts
          git diff -- e2e/stage-j.spec.ts src/features/financial/periods.ts
